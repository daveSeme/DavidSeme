<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard | David Seme</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #151a18;
            --border: #24302b;
            --text: #e4eae7;
            --text-secondary: #889992;
            --teal: #35b98d;
            --gold: #d9a441;
            --red: #e15c5c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Poppins', sans-serif; line-height: 1.6; }
        
        .login-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 2rem; width: 400px; max-width: 90vw; }
        .login-box h2 { color: var(--text); margin-bottom: 1.5rem; text-align: center; }
        .login-box input { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; margin-bottom: 1rem; font-size: 1rem; }
        .login-box button { width: 100%; padding: 12px; background: linear-gradient(135deg, #1f8f6d, #35b98d); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; }
        .error { color: var(--red); text-align: center; margin-bottom: 1rem; font-size: 0.85rem; }
        
        .container { max-width: 1300px; margin: 0 auto; padding: 20px; }
        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 0; margin-bottom: 2rem; }
        header .container { display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.2rem; font-weight: 600; }
        header button { background: transparent; border: 1px solid var(--red); color: var(--red); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 2rem; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; text-align: center; }
        .stat-card .number { font-size: 2rem; font-weight: 700; color: var(--teal); font-family: 'JetBrains Mono', monospace; }
        .stat-card .label { font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px; }
        .stat-card.pending .number { color: var(--gold); }
        
        .section { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .section h3 { font-size: 1rem; margin-bottom: 1rem; color: var(--teal); }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        th { text-align: left; padding: 10px 12px; border-bottom: 2px solid var(--border); color: var(--text-secondary); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 10px 12px; border-bottom: 1px solid rgba(36,48,43,0.5); font-size: 0.8rem; }
        tr:hover { background: rgba(53,185,141,0.04); }
        
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: 600; }
        .badge-pending { background: rgba(217,164,65,0.15); color: var(--gold); border: 1px solid rgba(217,164,65,0.3); }
        .badge-approved { background: rgba(53,185,141,0.15); color: var(--teal); border: 1px solid rgba(53,185,141,0.3); }
        .badge-rejected { background: rgba(225,92,92,0.15); color: var(--red); border: 1px solid rgba(225,92,92,0.3); }
        
        .request-card { border: 1px solid var(--border); border-radius: 10px; padding: 1rem; margin-bottom: 0.8rem; }
        .request-card .meta { font-size: 0.72rem; color: var(--text-secondary); margin-bottom: 4px; }
        .request-card .project-name { color: var(--teal); font-weight: 600; }
        .request-card .actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-sm { padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; font-size: 0.7rem; font-weight: 500; text-decoration: none; display: inline-block; }
        .btn-sm.approve { border-color: var(--teal); color: var(--teal); }
        .btn-sm.reject { border-color: var(--red); color: var(--red); }
        .btn-sm.copy { border-color: #5b8def; color: #5b8def; }
        
        .mono { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--text-secondary); }
        .loading { text-align: center; padding: 3rem; color: var(--text-secondary); }
        .empty { text-align: center; padding: 2rem; color: var(--text-secondary); }
        
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .hide-mobile { display: none; }
        }
    </style>
</head>
<body>

<div id="loginScreen" class="login-container">
    <div class="login-box">
        <h2>🔐 Admin Access</h2>
        <div id="loginError" class="error" style="display:none;"></div>
        <input type="password" id="passwordInput" placeholder="Enter password" autofocus>
        <button onclick="login()">Unlock Dashboard</button>
    </div>
</div>

<div id="dashboard" style="display:none;">
    <header>
        <div class="container">
            <h1>📊 Portfolio Analytics</h1>
            <button onclick="logout()">Logout</button>
        </div>
    </header>
    
    <div class="container">
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="number">-</div><div class="label">Visitors Today</div></div>
            <div class="stat-card"><div class="number">-</div><div class="label">Total Page Views</div></div>
            <div class="stat-card"><div class="number">-</div><div class="label">Unique Visitors</div></div>
            <div class="stat-card pending"><div class="number">-</div><div class="label">Pending Requests</div></div>
            <div class="stat-card"><div class="number">-</div><div class="label">Total Requests</div></div>
        </div>
        
        <div class="section">
            <h3>🔐 Project Access Requests</h3>
            <div id="requestsContainer"><div class="loading">Loading...</div></div>
        </div>
        
        <div class="section">
            <h3>👁️ Recent Visitors</h3>
            <div style="overflow-x:auto;">
                <table>
                    <thead><tr><th>Time</th><th>Page</th><th class="hide-mobile">IP</th><th class="hide-mobile">Referrer</th></tr></thead>
                    <tbody id="visitorsTable"><tr><td colspan="4" class="loading">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
let PASSWORD = '';

function login() {
    PASSWORD = document.getElementById('passwordInput').value;
    document.getElementById('loginError').style.display = 'none';
    loadDashboard();
}

function logout() {
    PASSWORD = '';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('passwordInput').value = '';
}

async function loadDashboard() {
    try {
        const res = await fetch(`/api/admin/stats?password=${encodeURIComponent(PASSWORD)}`);
        if (res.status === 401) {
            document.getElementById('loginError').textContent = 'Invalid password';
            document.getElementById('loginError').style.display = 'block';
            return;
        }
        if (!res.ok) throw new Error('Failed to load');
        
        const data = await res.json();
        
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        
        // Stats
        const cards = document.querySelectorAll('.stat-card .number');
        cards[0].textContent = data.stats.todayVisitors;
        cards[1].textContent = data.stats.totalVisitors;
        cards[2].textContent = data.stats.uniqueIPs;
        cards[3].textContent = data.stats.pendingRequests;
        cards[4].textContent = data.stats.totalRequests;
        
        // Requests
        if (data.requests.length === 0) {
            document.getElementById('requestsContainer').innerHTML = '<div class="empty">No access requests yet.</div>';
        } else {
            document.getElementById('requestsContainer').innerHTML = data.requests.map(r => `
                <div class="request-card">
                    <div class="meta">
                        ${new Date(r.requestedAt).toLocaleString()} • 
                        <span class="badge badge-${r.status}">${r.status.toUpperCase()}</span>
                    </div>
                    <strong>${esc(r.name)}</strong> <span class="meta">(${esc(r.email)})</span>
                    <div class="project-name">📌 ${esc(r.project)}</div>
                    <div style="font-size:0.78rem;color:var(--text-secondary);margin-top:4px;">
                        <strong>Interest:</strong> ${esc(r.interest)}
                        ${r.message ? `<br><strong>Message:</strong> "${esc(r.message)}"` : ''}
                    </div>
                    <div class="actions">
                        ${r.status === 'pending' ? `
                            <button class="btn-sm approve" onclick="updateStatus('${r.id}','approved')">✓ Approve</button>
                            <button class="btn-sm reject" onclick="updateStatus('${r.id}','rejected')">✗ Reject</button>
                        ` : ''}
                        <button class="btn-sm copy" onclick="navigator.clipboard.writeText('${esc(r.email)}').then(()=>alert('Email copied!'))">📧 Copy</button>
                        <a href="mailto:${esc(r.email)}?subject=Re:${encodeURIComponent(r.project)}" class="btn-sm">✉️ Reply</a>
                    </div>
                </div>
            `).join('');
        }
        
        // Visitors
        if (data.visitors.length === 0) {
            document.getElementById('visitorsTable').innerHTML = '<tr><td colspan="4" class="empty">No visitors yet.</td></tr>';
        } else {
            document.getElementById('visitorsTable').innerHTML = data.visitors.map(v => `
                <tr>
                    <td class="mono">${new Date(v.visitedAt).toLocaleString()}</td>
                    <td>${esc(v.page)}</td>
                    <td class="mono hide-mobile">${esc(v.ip)}</td>
                    <td class="hide-mobile" style="font-size:0.7rem;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(v.referrer || 'Direct')}</td>
                </tr>
            `).join('');
        }
        
    } catch (err) {
        document.getElementById('loginError').textContent = 'Connection failed. Try again.';
        document.getElementById('loginError').style.display = 'block';
    }
}

async function updateStatus(requestId, status) {
    try {
        await fetch('/api/admin/update-status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: PASSWORD, requestId, status })
        });
        loadDashboard();
    } catch (err) {
        alert('Failed to update');
    }
}

function esc(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
}

document.getElementById('passwordInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') login();
});
</script>
</body>
</html>
